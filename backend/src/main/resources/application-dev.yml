spring:
  datasource:
    url: jdbc:h2:file:./data/sunnyblog;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data-demo.sql
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.sunnyblog.mapper: debug
