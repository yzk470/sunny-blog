server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: sunny-blog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: ${DEEPSEEK_TEMPERATURE:0.7}
  lifecycle:
    timeout-per-shutdown-phase: 10s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: 月白小筑 API
    version: 1.0.0
    description: 阳光明媚的个人博客后端接口

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:sunny-blog-deepseek-2025-secret-key-please-change-me-in-production-0123456789}
    expire-hours: ${JWT_EXPIRE_HOURS:168}
  admin:
    username: ${ADMIN_USERNAME:月白}
    password: ${ADMIN_PASSWORD:change-me}
    nickname: ${ADMIN_NICKNAME:月白}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    image-dir: ${UPLOAD_IMAGE_DIR:./data/uploads}
    url-prefix: ${UPLOAD_URL_PREFIX:/api/uploads}
  mcp:
    enabled: ${MCP_ENABLED:true}
    api-key: ${MCP_API_KEY:}
    public-site-url: ${SITE_URL:https://www.bluish-white.top}
  digital-human:
    audio-dir: ${DIGITAL_HUMAN_AUDIO_DIR:./data/digital-human/audio}
    motion-dir: ${DIGITAL_HUMAN_MOTION_DIR:./data/digital-human/motions}
    max-history: ${DIGITAL_HUMAN_MAX_HISTORY:10}
    max-context-chars: ${DIGITAL_HUMAN_MAX_CONTEXT_CHARS:5000}
  agent:
    dir: ${AGENT_DATA_DIR:./data/agent}
    execution-enabled: ${AGENT_EXECUTION_ENABLED:true}
    max-steps: ${AGENT_MAX_STEPS:10}
    command-timeout-seconds: ${AGENT_COMMAND_TIMEOUT:20}
    max-output-chars: ${AGENT_MAX_OUTPUT_CHARS:12000}
    model: ${AGENT_MODEL:deepseek-flash}
    systemd-run: ${AGENT_SYSTEMD_RUN:false}
    systemd-runtime-dir: ${AGENT_SYSTEMD_RUNTIME_DIR:/run/user/999}
    systemd-runner: ${AGENT_SYSTEMD_RUNNER:/usr/local/bin/sunny-agent-run}
    systemd-private-network: ${AGENT_SYSTEMD_PRIVATE_NETWORK:true}
  rag:
    redis-host: ${RAG_REDIS_HOST:127.0.0.1}
    redis-port: ${RAG_REDIS_PORT:6380}
    dir: ${RAG_DATA_DIR:./data/agent/rag}
    embedding-key: ${DASHSCOPE_API_KEY:}
    embedding-base-url: ${DASHSCOPE_EMBEDDING_BASE:https://maas.qianwenaiapi.com/api/v1}
    embedding-model: ${RAG_EMBEDDING_MODEL:qwen3-vl-embedding}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    coarse-top-k: ${RAG_COARSE_TOP_K:12}
    final-top-k: ${RAG_FINAL_TOP_K:5}
    max-chars: ${RAG_CHUNK_CHARS:800}
    overlap: ${RAG_CHUNK_OVERLAP:120}

hunyuan:
  motion:
    api-key: ${HUNYUAN_MOTION_API_KEY:}
    base-url: ${HUNYUAN_MOTION_BASE_URL:https://tokenhub.tencentmaas.com}
    model: ${HUNYUAN_MOTION_MODEL:hy-3d-motion}

aliyun:
  tts:
    api-key: ${ALIYUN_TTS_API_KEY:}
    api-url: ${ALIYUN_TTS_API_URL:wss://dashscope.aliyuncs.com/api-ws/v1/inference}
    model: ${ALIYUN_TTS_MODEL:cosyvoice-v3-flash}
    voice: ${ALIYUN_TTS_VOICE:longyingxiao_v3}
    sample-rate: ${ALIYUN_TTS_SAMPLE_RATE:24000}
    response-format: ${ALIYUN_TTS_FORMAT:wav}

logging:
  level:
    root: info
    com.sunnyblog: info
